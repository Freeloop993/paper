<script type="application/json" id="payload">{"items": [{"id": "S001", "text": "一如既往的好,继续选择自营"}, {"id": "S002", "text": "东西很齐全,材质手感也不错,新手逐步学习了一天,感觉差不多了就出来练练,第一次试飞感觉还不错,比较容易上手"}, {"id": "S003", "text": "适合航拍新手,功能和清晰度入门级足够。轻巧便携,常规操作即可,风险可控。"}, {"id": "S004", "text": "续航:一般 外观:很好 拍照能力:好"}, {"id": "S005", "text": "东西是不错,可惜北京基本都是禁飞区。。。"}, {"id": "S006", "text": "运行速度快,拍照清晰,外观漂亮,喜欢"}, {"id": "S007", "text": "还不错,很喜欢,性能稳定"}, {"id": "S008", "text": "心心念念的大疆掌上飞行器终于到手了,这是送给儿子二十一岁的生日礼物!小巧轻便,易操作,价格不贵,新手老手没有负担。"}, {"id": "S009", "text": "开辟一个新爱好,赞 操作难易:有点挑战,得训练 灵敏度:新手、后期都能满足 稳定性:目前没有发现问题 做工质量:觉得很精致 外形外观:喜欢"}, {"id": "S010", "text": "好,很好的产品,做工精致大方上档次,操作方便快捷"}, {"id": "S011", "text": "入门产品,小巧灵活,操作简单"}, {"id": "S012", "text": "大疆无人机值得购买!"}, {"id": "S013", "text": "非常满意。"}, {"id": "S014", "text": "必须给京东一个大大的赞!购买的这款商品价格实惠,性价比一流。物流速度快得惊人,下单没多久就收到了。打开包装,商品完好无损,质量超出想象,使用起来效果很棒,很满意这次的购物。"}, {"id": "S015", "text": "非常好玩的无人机!自动跟随棒棒哒!"}, {"id": "S016", "text": "飞行稳定,续航足够,没有任何问题,避障灵敏。"}, {"id": "S017", "text": "材质结实,手感好,很得劲,物流也快,性价比很高,值得购买非常满意的购物体验,产品外观时尚,质量上乘,性价比高,物流快速,商家服务周到。"}, {"id": "S018", "text": "非常好,买来第三天就摔了(悲 不过东西还是很不错的!好评!"}, {"id": "S019", "text": "dji不愧是dji,云台好稳,Flip性价比很高了"}, {"id": "S020", "text": "灵敏度:精准 操作难易:容易 稳定性:超稳 做工质量:质量好 外形外观:好看 其他特色:性价比超高。值得入手😊"}, {"id": "S021", "text": "收到东西很棒很喜欢。客服热情及时解决问题,好评!"}, {"id": "S022", "text": "小飞机操作很简单,灵敏度很强,飞行稳定,值得购买和信赖"}, {"id": "S023", "text": "非常好,宝贝很高大上,质量很好,看上去就给人一种高级感,价格也合适,这次网购很愉快,大赞,正好赶上国补,买了畅飞套装,期待试飞。"}, {"id": "S024", "text": "X1 换代入手了ProMax,感觉功能增强不少,首发前 20 名还退了我订金😁,希望后续升级为无损竖拍,还有收纳包出个单机便携版吧。"}, {"id": "S025", "text": "收到就带着去皖南赏秋了,给小视频增加了新意。比无人机方便,好几个人询问。总的来说能满足我的需求。(如果想大场面、更清晰、不怕风不怕水还得无人机)"}, {"id": "S026", "text": "无人机收到货了还没拆,商家服务态度好,以后需求继续购买。"}, {"id": "S027", "text": "还行"}, {"id": "S028", "text": "大疆mini2无人机买了四年,一次也没飞过,自带的电池也就开机时充过一次电,硬是在柜子里放了四年,结果放坏了,质量堪忧。着急用电池,就在京东上买了原厂的,除了贵,目前没啥毛病。放坏的电池申请了售后,因为无法维修,售后给换了一块新电池,费用是原价的一半。"}, {"id": "S029", "text": "大疆 Mini 3 是一款极具性价比的无人机,特别适合航拍新手使用。它具备出色的续航能力和稳定的图传系统,即使在复杂的环境中也能保持良好的表现。轻巧的设计使得携带和操作都非常方便,是记录生活和分享美景的理想选择。"}, {"id": "S030", "text": "操作方便,体验感好"}, {"id": "S031", "text": "物流很给力,使用很方便。"}, {"id": "S032", "text": "非常好的无人机,画质好,操控好。"}, {"id": "S033", "text": "不错不错👍👍非常好的体验"}, {"id": "S034", "text": "客服态度特别好,发货特别快,物流隔天就收到货,还有商家送的原装桨叶!电池首次还要充电激活!是原装真品!"}, {"id": "S035", "text": "不错,新手入门级。。。"}, {"id": "S036", "text": "诈骗!买的畅飞,只有一块机身电池! 还不给处理!"}, {"id": "S037", "text": "很好的玩具,很棒的无人机,反正呢,我很喜欢😍,第一架在百亿补贴买的,单机,送姐姐了。第二架在这里买,畅飞套装,遥控器才能飞的远,信号可以的。推荐。另,要是商家配个收纳袋就好了,不用收纳盒,袋子就好。"}, {"id": "S038", "text": "操作难易:非常顺滑,操作简便功能强大 灵敏度:状态保持很稳定,可以扛住一般风速 稳定性:悬停稍有位移,但是很稳定 做工质量:质量上乘,千元无人机顶峰了 外形外观:很时尚很酷 其他特色:三电套装还有整理包,加上三电遥控和无人机一包带走,简直不要太方便,太便于携带了,拍摄质量很好,出门旅游,视频剪辑利器啊,太无敌了,而且现在涨价了哦"}, {"id": "S039", "text": "宝贝收到了,很不错的哈浮飞行相机。 操作难易:操作不是很复杂,一部手机照着说明书来就可以了。 灵敏度:灵敏度也挺高的, 稳定性:在房间里试飞了一下,旋停的稳定性很不错。 做工质量:做工很精致。 先看看我收到的图片吧。"}, {"id": "S040", "text": "机器很帅气,客服有问必答,好评"}, {"id": "S041", "text": "这次购物体验超棒,商品性价比高,质量优秀。物流高效快捷,商家服务周到,售后完善。买到了心仪的商品,物美价廉,质量好得没话说。物流顺畅,商家服务细致,售后服务靠谱。质量很过关,品质优保障,相当不错的选择,好多朋友看我用都想买,我都推荐了。"}, {"id": "S042", "text": "纯新手小白,第一次接触无人机,哈哈,上手还不错,运镜之类的还得多多摸索"}, {"id": "S043", "text": "好好好推荐推荐推荐好好好"}, {"id": "S044", "text": "服务很好,叶片收到货是瑕疵品也给我补发了一套。大疆无人机飞行稳定,画质清晰,操作简便,是摄影爱好者的绝佳选择!高清摄像头捕捉每一个精彩瞬间,智能遥控让飞行更加自如。大疆品质,值得信赖,为拍摄带来更多可能!"}, {"id": "S045", "text": "非常棒.携带方便.上手快.操作简单灵活.日常旅拍.出去办公使用都可以.抗风能力也不错空中很稳.拍的很清晰.性价比很高.不错"}, {"id": "S046", "text": "试飞了一下,简单易懂,灵活度高。"}, {"id": "S047", "text": "操作方便简单,都不用短按长按,灵敏小巧。稳定性强,以为不抗风,5级左右风相当稳。 带了保护罩,质量没得说,妥妥放心。拍照也清晰,非常不错!"}, {"id": "S048", "text": "买来送朋友的,相机很轻巧,操作简单,朋友很喜欢。"}, {"id": "S049", "text": "非常漂亮的飞机✈服务态度非常的好。有不懂的问题,客服也非常细心的解答。"}, {"id": "S050", "text": "小巧玲珑,简单易学,模式多样,确实是入门小白的福音,下周再去外景看看效果。"}, {"id": "S051", "text": "操作简单,很容易上手,很好"}, {"id": "S052", "text": "看了很长时间了,终于入手了,很喜欢。"}, {"id": "S053", "text": "追加小娜不错"}, {"id": "S054", "text": "预售买的,发货很快,第二天就到了。等休息了有空去空旷的地方试下。"}, {"id": "S055", "text": "看刻烫,是一时间热包装,感觉搭量送楚过时奶,与重素精和这美 规奶,拼背清意 发理排接化材味 助煮公司能票态维精材,在波搭维精体,经奶米接湿发楚释清意的一次购粉便苑馆攀出付,施了一段好用E高排价。"}, {"id": "S056", "text": "操作难易:操作起来很简单,新手也可以直接上手 灵敏度:灵敏度极高 稳定性:稳定性也特别棒 外形外观:外形小巧便携"}, {"id": "S057", "text": "先说neo,是我见过性价比最高的大疆的无人机,最独特的就在于他的掌上的六个模式,拍短视频完全没问题,并且很小很灵活,外观上看着也很可爱 再说服务态度,看图片,客服一一解答,并且按照承诺给了补偿。"}, {"id": "S058", "text": "不愧是大品牌,颜值高飞得稳,还有一键返航不怕飞丢"}, {"id": "S059", "text": "非常好用,小白第一次买无人机,看了~上的攻略,上手很快,稳定性也不错,值得初次使用无人机小白购买使用。"}, {"id": "S060", "text": "非常牛"}, {"id": "S061", "text": "小飞机很适合一个人的时候充当跟拍师的角色,无需遥控器和手机直接起飞很方便,尤其适合户外运动场景,不需要携带多余配件,用下来体验不错"}, {"id": "S062", "text": "稳定性:款式新颖,设计好看,材质优良,质量超棒。商家服务热情周到,使用体验舒适,物流快如闪电,性价比超高,非常满意!"}, {"id": "S063", "text": "东西不错 与描述相符"}, {"id": "S064", "text": "娃娃学学飞行,体验感很好"}, {"id": "S065", "text": "买回来一看质量非常好,与卖家描述的完全一致,非常满意,真的很喜欢,完全超出期望值,发货速度非常快,包装非常仔细、严实,物流公司服务态度很好,运送速度很快,很满意的一次购物!"}, {"id": "S066", "text": "〔隐去联系方式或编号〕"}, {"id": "S067", "text": "非常小巧,折叠起来手掌大小,以前飞过大疆精灵2,挺大个的!在客厅试飞了一下,完美!送的配件很多很有用,包质量也很好!"}, {"id": "S068", "text": "大疆无人机包装精细,充电准备试飞一下,很期待。"}, {"id": "S069", "text": "下午拿到机器充会电飞了一圈,我是第一次接触无人机上手20分钟左右就飞熟练了其次这款机器的避障能力对于小白来说实在是太好用了,以及跟车,跟人,简直是太好用了,跟车过程中自动避障,包括显示效果飞机很稳定大品牌就是可以"}, {"id": "S070", "text": "还没试飞呢,但看着精致,非常好。"}, {"id": "S071", "text": "质量很好,发货速度也很快,好评"}, {"id": "S072", "text": "快递到了迫不及待的去拿了,比air3多了激光避障和夜景避障,四舍五入相当于加量不加价,感觉对于非摄影专业玩家来说这个比御3pro性价比要高。"}, {"id": "S073", "text": "很喜欢,操作简单,上手容易。 大品牌值得信赖。下次还会光临"}, {"id": "S074", "text": "孙子9岁生日,酷爱科技产品,送他个小礼物,决定买个飞机。相信大疆品牌,收到后他动手操控,拍下一段视频,真是不错!"}, {"id": "S075", "text": "很好,飞机很好看,飞起来也很稳,打算过几天去拍拍风景"}, {"id": "S076", "text": "同事推荐的,相机做工不错,材质很轻,外观小巧,收纳携带方便,操作简单,手掌起飞。送了皮质保护套。物流很快,下单第二天就收到了。"}, {"id": "S077", "text": "趁着国补入手畅飞套装,便宜400刚好买了两年的DJI care,京东自营发货快!体积小巧,上手飞非常容易!送的保护罩新手实用!客服热情周到!随手拍不一样的视角!"}, {"id": "S078", "text": "孩子一年级,生日礼物要无人机,于是赶紧做功课,品牌锁定大疆,在NEO和FLIP之间选,最后买了NEO。作为一款吸引孩子入门的无人机,它真是太棒了。120米的高度足够,续航短和抗风弱在它亲民的价格面前都不是问题。打算再买个眼镜和摇杆体验一下。"}, {"id": "S079", "text": "作为一名无人机爱好者,我最近入手了大疆Avata 2,这款产品真的让我眼前一亮!以下是我的使用体验: 1. 飞行体验极佳:Avata 2的操控非常流畅,无论是新手还是老手都能轻松上手。它的机动性很强,可以完成各种高难度动作,飞行体验非常刺激! 2. 画质出色:搭载的摄像头支持4K高清录制,画质清晰细腻,色彩还原度很高,无论是拍摄风景还是动态视频,效果都非常惊艳。 3. 稳定性强:即使在风速较大的环境下,Avata 2也能保持稳定飞行,防抖功能让拍摄的画面非常平滑,完全不用担心抖动问题。 4. 续航给力:电池续航时间比我想象的要长,一次充电可以飞行将近20分钟,完全满足我的拍摄需求。 5. 设计轻便:机身小巧轻便,携带起来非常方便,出门旅行或者户外活动时都可以随时拿出来拍摄。 6. 智能功能丰富:支持一键返航、智能跟随、避障等功能,安全性很高,即使是新手也能放心飞行。 7. FPV体验震撼:搭配FPV眼镜使用,沉浸感十足,仿佛自己就在空中飞行,视角非常震撼!"}, {"id": "S080", "text": "之前就关注过这款,配件齐全,是正品的东西不错的无人机很合适新手。超级给力,尺寸小巧精致,便携,还有全向避障,还很好使的,旅途天"}, {"id": "S081", "text": "宝贝已收到🎈,超级喜欢,颜值高又实用,超级喜欢!❥❥❥"}, {"id": "S082", "text": "之前用的御系列,为了拍竖屏,也为了携带方便,买了顶配的mini4,感觉好轻巧,画质也不错,无损竖屏,不错不错!"}, {"id": "S083", "text": "到货啦"}, {"id": "S084", "text": "这是第二次在他们家买很不错,可以无脑入,"}, {"id": "S085", "text": "嗨起来"}, {"id": "S086", "text": "物流很快!客服有耐心!"}, {"id": "S087", "text": "超级好用,性价比高,美观大方,旅行携带方便"}, {"id": "S088", "text": "一直想要个大疆无人机,这次算是正式入圈了。"}, {"id": "S089", "text": "没使用呢,还不知道质量如何"}, {"id": "S090", "text": "飞行距离也就宣传的十分之一"}, {"id": "S091", "text": "无人机是全新未激活,包装也很好没有破损,拍照录像很清晰,卖家送了很多配件,好评"}, {"id": "S092", "text": "昨天下午到货的 因为风太大 没有立即体验无人机在天空飞翔的乐趣 今天下午出门试飞 操作简单 直接内八 拍摄的照片很清晰 加上水印也是十分的美观 产品质量嘎嘎好 飞行器在天上很稳定 入门无人机纠结mini3和mini4k 最后选择了mini3 迷你的很可爱 非常非常喜欢 宝贝非常非常奈斯 非常非常满意!"}, {"id": "S093", "text": "不错不错,值得购买"}, {"id": "S094", "text": "国补给力,大疆品质,没得说,好评"}, {"id": "S095", "text": "非常好值得购买非常的满意 稳定性:非常棒 做工质量:质量很好"}, {"id": "S096", "text": "大疆无人机官方旗舰店真是牛,好操控,平稳性好,返航位置准确"}, {"id": "S097", "text": "我是新手,这一款对新手很不错,售后也很亲切!!物美价廉"}, {"id": "S098", "text": "已收到并使用,照片清晰,遇到了手机快传图片无法使用问题已解决,但是目前不支持鸿蒙NEXT系统,请尽快适配APP"}, {"id": "S099", "text": "用起来很方便,老人也会用,客服也很耐心,要问必答。很小巧挺好的,不占地方还很轻。拍出来的照片很清晰,视频也很稳。"}, {"id": "S100", "text": "容易操作,灵敏稳定,体重太轻,容易飘"}, {"id": "S101", "text": "不错不错不错不错不错不错不错吧不出差吧吧吃吧吃吧吃吧"}, {"id": "S102", "text": "非常好用"}, {"id": "S103", "text": "第一架无人机,主要需求是单人跟拍和探路。机身小巧便携,起降宽容度高,像素清晰发朋友圈足矣,比买的时候优惠了一百左右但可接受,如果按现在的价格更倾向畅飞版,期待新一代neo系列的表现。"}, {"id": "S104", "text": "飞机特别小巧方便,我主要看上他无损竖拍,另外赠送也不错,值得大家入手。"}, {"id": "S105", "text": "非常喜欢,新手入手的第一架小飞机!"}, {"id": "S106", "text": "操作难易:还行吧,在无人机行列算简单的 灵敏度:灵敏度还行,别飞太远 稳定性:稳定性一般,抗风能力有限 做工质量:做工还行,大疆的标准 外形外观:很酷,阿凡达那种样子 其他特色:一套买来,买来就飞"}, {"id": "S107", "text": "体验感很好 起飞也很方便"}, {"id": "S108", "text": "买了已用上了,赠品多,价格实惠,值得推荐!激发了我航拍的热情!"}, {"id": "S109", "text": "东西收到了 快递特别给力 服务态度也很好 不愧是京东 之后还会继续关顾京东的。"}, {"id": "S110", "text": "非常好玩非常好玩很喜欢,推荐大家买来玩"}, {"id": "S111", "text": "这个垃圾机器,千万别买?买了就坏了,大疆除了换客服摔锅快,再没啥快了。哦对了机器坏的也快。"}, {"id": "S112", "text": "很稳,就是那个ai功能第一次用摸索了半天,客服也很好,售后再追评"}, {"id": "S113", "text": "大疆nb"}, {"id": "S114", "text": "304061胡椒厨房冰箱冷藏箱包厂"}, {"id": "S115", "text": "开机后操作比较灵敏,购买这个无人机,主要是想记录儿子的成长过程,以及亲朋好友聚会时候用,记录美好瞬间。 这个无人机比较轻,携带比较方便,卖家还送了一个包!"}, {"id": "S116", "text": "从发布的当晚就开始看直播 发现二代比一代帅太多了 功能也更加的完善了 华飞真的不错 直播间看了很久 最终决定入手第一波 操作难易:还可以 灵敏度:不错 稳定性:比2s差一些 做工质量:还可以 外形外观:很帅"}, {"id": "S117", "text": "最主要的优点是操作简易,很快就能上手,外观时尚。非常适合旅途使用。"}, {"id": "S118", "text": "包装很好,发货快,学习材料很充分,服务态度很好,货品质量上乘!!!是好东西!!!"}, {"id": "S119", "text": "此无人机适合初学者使用,适合自拍用。"}, {"id": "S120", "text": "便携,很方便,用了一周了,使用仔细无磕碰无炸机情况,三块电池足够用了。日常活动好搭子。 真好。"}, {"id": "S121", "text": "经过20次飞行的用户心得 经过5个品牌的使用对比,最终还是大疆。 app的使用,遥控的使用,摄像头的清晰 飞机的材质,飞机的稳定性,细致操作等, 无可挑剔,2000元内无敌好用的存在。 非专业的玩无人机,这个neo是你最好的选择,一个月多品牌使用后真心推荐,写个点评,免去大家走冤枉路。"}, {"id": "S122", "text": "很好玩很好玩不错不错"}, {"id": "S123", "text": "服务很好希望哈浮不会让我失望"}, {"id": "S124", "text": "稳定性:好 做工质量:棒 外形外观:美观"}, {"id": "S125", "text": "本来想买个高级点,但考虑到是入手第一台的大疆无人机,还是先从最容易的开始吧!这台Neo小巧轻便,容易操控,特来别适合新手,试了试..还不错点赞👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍👍"}, {"id": "S126", "text": "无人机非常小巧便携,不过眼镜可太大了,买了个收纳箱,箱子挺大。如果出去爬山什么的,只能光带小家伙。"}, {"id": "S127", "text": "非常棒的一个产品,直接改变旅行体验"}, {"id": "S128", "text": "发货快,品质好,与手机连接交互顺畅,在京东自营店购买数码产品放心,需要还会继续回购的。"}, {"id": "S129", "text": "买后没有发现缺点,超级满意"}, {"id": "S130", "text": "东西质量非常好,与卖家描述的完全一致,非常满意,真的很喜欢,完全超出期望值,发货速度非常快,包装非常仔细、严实,物流公司服务态度很好,很快,很满意的一次购物。"}, {"id": "S131", "text": "到货快"}, {"id": "S132", "text": "操作难易:桨叶安装逻辑比mini4Pro好多了,快拆设计也不怕螺丝拧滑丝了。 灵敏度:操作灵敏,动力强劲速度很快。 稳定性:悬停稳定,云台防抖效果非常好。"}, {"id": "S133", "text": "这款无人机完全超出我的预期!机身轻巧到可以单手托起,折叠后直接塞进背包,旅行携带毫无压力。4K镜头的清晰度太惊艳了,连百米外树叶的脉络都能清晰捕捉,搭配三轴云台防抖,阴天拍摄的画面依然稳定流畅。最惊喜的是续航表现,官方标的31分钟实际飞了28分钟还有余电,三块电池足够拍完整个聚会。新手模式对小白特别友好,一键起降和智能返航让我这种手残党也能拍出电影感画面。店家服务也很贴心,顺丰次日达,包装里居然还配了防水收纳盒和螺旋桨保护罩。从开箱到首飞全程零障碍,客服连遥控器校准都录了视频指导。这个价位能买到专业级航 // S2 评论核查，b 版（2026-11-20）。150 条题目与顺序同 a 版，对应键不变。
// 比 a 版多三样：开始前记下作答者的情况；每次作答自动存在本机浏览器里，关掉页面不丢；记下每条停留的时间。
const {items,topics}=JSON.parse(document.getElementById('payload').textContent), app=document.getElementById('app'), $=id=>document.getElementById(id);
const no='以上均未提到', options=['涉及','未涉及','信息不足'], version='S2-20261120-b', KEY='S2-b-draft';
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||S.version!==version) S={version,started_at:null,finished_at:null,respondent:{},answers:{},at:0};
let i=S.at||0, shown=0; const store=()=>{S.at=i; try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const id=()=>items[i].id, answer=()=>S.answers[id()]??={scope:'',topics:[],note:'',ms:0};
const valid=r=>r&&options.includes(r.scope)&&Array.isArray(r.topics)&&r.topics.length>0&&r.topics.every(t=>[...topics,no].includes(t))&&(!r.topics.includes(no)||r.topics.length===1);
const label=(title,type,on,fn)=>{let el=document.createElement('label'),input=document.createElement('input');input.type=type;input.checked=on;input.addEventListener('change',fn);el.append(input,' '+title);return el;};
const QS=[['role','你现在是',['硕士研究生','博士研究生','其他']],['field','你的专业方向',['设计类','其他工科','其他']],['seen','你是否看过这项研究对这批评论的分类结果、证据卡或论文稿',['没有','看过']],['repo','你是否打开过这项研究的资料库或代码仓库',['没有','打开过']]];
function intro(){
  app.innerHTML='<article><h1>航拍机评论文字核查</h1><p>一共 '+items.length+' 条无人机买家评论。每条回答两个问题：它有没有在说机体的外形；文字里明确提到了哪些方面。请按评论者实际说的话判断，拿不准可以选「信息不足」。大约一个小时，可以分几次做：作答会自动存在这台电脑的这个浏览器里，关掉页面再打开会接着上次的位置。</p><p>不需要姓名。页面不联网。全部做完后导出一份文件发回。</p><h2>开始之前</h2><div id="qs"></div><p><button class="go" id="go" disabled>开始</button></p></article>';
  QS.forEach(([k,q,opts])=>{let l=document.createElement('label');l.className='q';l.textContent=q+'　';let s=document.createElement('select');s.id='q-'+k;s.append(new Option('请选择',''),...opts.map(o=>new Option(o,o)));s.value=S.respondent[k]||'';s.onchange=chk;l.append(s);$('qs').append(l)});
  function chk(){ $('go').disabled=!QS.every(([k])=>$('q-'+k).value) } chk();
  $('go').onclick=()=>{QS.forEach(([k])=>S.respondent[k]=$('q-'+k).value); S.started_at=S.started_at||new Date().toISOString(); store(); work()};
}
function work(){
  app.innerHTML='<article><span id="progress"></span><blockquote id="quote"></blockquote><h2>这条评论涉及机体外形吗？</h2><small>涉及轮廓、尺寸观感、折叠形态、部件外观、颜色或表面时选「涉及」。只讲操控、拍摄性能或物流时选「未涉及」。没有说清对象时可选「信息不足」。</small><div id="scope"></div><h2>文字明确提到了哪些主题？</h2><small>可多选。单说「方便带出门」可以勾随身携带；只有提到大小或紧凑时才勾小巧或紧凑。正面、负面、愿望都可以记。没有对应主题可单选「以上均未提到」。</small><div id="tags"></div><p><span>支持判断的原话（可选，摘几个字即可）</span><br><input id="note" type="text" maxlength="160" aria-label="文字依据"></p></article><nav><button id="prev">上一条</button><select id="jump" aria-label="选择条目"></select><button id="next">下一条</button><button id="missing">第一条未完成</button></nav><p><button id="draft">导出草稿</button><button class="go" id="finish">导出完整答卷</button><label>载入草稿 <input id="load" type="file" accept=".json"></label></p><p role="status" id="msg"></p>';
  const tick=()=>{ if(shown){ answer().ms+=Date.now()-shown } shown=Date.now() };
  function draw(){let r=answer();$('quote').textContent=items[i].text;$('jump').value=i;$('note').value=r.note;
    $('progress').textContent=id()+'　共 '+items.length+' 条，已完成 '+Object.values(S.answers).filter(valid).length+' 条';
    $('scope').replaceChildren(...options.map(v=>label(v,'radio',r.scope===v,()=>{r.scope=v;store();draw()})));
    $('tags').replaceChildren(...[...topics,no].map(v=>label(v,'checkbox',r.topics.includes(v),()=>{r.topics=r.topics.includes(v)?r.topics.filter(x=>x!==v):v===no?[no]:[...r.topics.filter(x=>x!==no),v];store();draw()})));
    $('prev').disabled=i===0;$('next').disabled=i===items.length-1}
  const go=j=>{tick(); i=j; shown=Date.now(); store(); draw()};
  items.forEach((r,j)=>$('jump').add(new Option(r.id,j)));$('jump').onchange=()=>go(+$('jump').value);
  $('prev').onclick=()=>{if(i)go(i-1)};$('next').onclick=()=>{if(i+1<items.length)go(i+1)};$('note').oninput=e=>{answer().note=e.target.value;store()};
  const missing=()=>items.findIndex(r=>!valid(S.answers[r.id]));
  $('missing').onclick=()=>{let j=missing();if(j>=0)go(j);else $('msg').textContent='全部已完成。'};
  function save(final){tick(); if(final&&missing()>=0){go(missing());$('msg').textContent='此条仍有未答项，可先导出草稿。';return}
    if(final&&!S.finished_at) S.finished_at=new Date().toISOString(); store();
    const out={version,complete:final,started_at:S.started_at,finished_at:final?S.finished_at:null,respondent:S.respondent,answers:S.answers};
    let u=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='S2-'+(final?'完整答卷':'草稿')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
    $('msg').textContent=final?'已导出完整答卷，请把下载的文件发回。':'已导出草稿。'}
  $('draft').onclick=()=>save(false);$('finish').onclick=()=>save(true);
  $('load').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.version!==version||!v.answers||!Object.entries(v.answers).every(([k,r])=>items.some(x=>x.id===k)&&r&&typeof r.scope==='string'&&Array.isArray(r.topics)&&typeof r.note==='string'))throw Error();Object.values(v.answers).forEach(r=>{r.ms=r.ms||0});S.answers=v.answers;S.respondent=v.respondent||S.respondent;S.started_at=v.started_at||S.started_at;go(Math.max(0,missing()));$('msg').textContent='已载入。'}catch{$('msg').textContent='载入失败，请使用本表导出的答卷。'}};
  window.addEventListener('pagehide',()=>{tick();store()}); shown=Date.now(); draw();
  if(Object.values(S.answers).some(valid)) $('msg').textContent='已接着上次的位置。';
}
if(S.started_at) work(); else intro();
</script></html>
