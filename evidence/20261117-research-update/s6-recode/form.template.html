<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评论短句编码</title>
<style>
:root{--ink:#17202a;--mute:#5d6b78;--line:#d5dbe1;--accent:#0b6bcb;--bg:#f6f7f9;--on:#e6f0fb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:16px 0}
h1{font-size:22px;margin:0 0 10px} h2{font-size:17px;margin:20px 0 6px} h3{font-size:16px;margin:0 0 8px}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;text-align:left}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff} button:disabled{opacity:.45;cursor:default}
button.opt.on{background:var(--on);border-color:var(--accent);font-weight:600}
.quote{font-size:20px;line-height:1.7;padding:14px 16px;background:#fffdf5;border:1px solid #eadfb8;border-radius:8px;margin:8px 0 4px;word-break:break-word}
.pair{border-top:1px solid var(--line);padding:12px 0} .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mute{color:var(--mute);font-size:14px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px} label{display:block;margin:6px 0}
textarea{width:100%;font:inherit} #code{height:110px;font:12px/1.4 monospace}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px} th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top} th{background:var(--bg)}
ol,ul{padding-left:22px;margin:6px 0} #book{display:none}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const PACK = __PACK__;
const KEY = 's6-recode-' + PACK.pack, app = document.getElementById('app'), $ = (id) => document.getElementById(id);
// 四个方面；按钮上的字与编码手册第一节的表一致
const PAIRS = [
  { k: 'span', name: '紧凑—舒展', L: '说它小、紧凑、收得拢', R: '说它大、占地方、伸得开', U: '谈到大小，但看不出偏哪边', N: '没谈大小或紧凑' },
  { k: 'plain', name: '简洁—繁复', L: '说外观简洁、干净', R: '说外观复杂、零碎、花哨', U: '谈到外观繁简，但看不出偏哪边', N: '没谈外观繁简' },
  { k: 'whole', name: '整体—拼凑', L: '说某个部件和机身是一体的，或希望做成一体', R: '说某个部件是另外加上去的、凸在外面', U: '谈到部件和机身的关系，但看不出偏哪边', N: '没谈部件和机身是否一体' },
  { k: 'color', name: '低调—醒目', L: '说颜色朴素、低调、不显眼', R: '说颜色鲜艳、醒目、好认', U: '谈到颜色或显眼程度，但看不出偏哪边', N: '没谈颜色或显眼程度' }];
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(list, r){ const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh(){ const u = crypto.getRandomValues(new Uint32Array(3)), seed = u[0];
  return { schema: PACK.schema, pack: PACK.pack, coder_id: (u[1].toString(16) + u[2].toString(16)).slice(0, 12), seed, order: shuffle(PACK.items.map((i) => i.id), rng(seed)),
    started_at: new Date().toISOString(), finished_at: null, at: -1, respondent: {}, notes: '', answers: {}, device: { w: innerWidth, h: innerHeight, ua: navigator.userAgent } }; }
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!S || S.pack !== PACK.pack) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TEXT = Object.fromEntries(PACK.items.map((i) => [i.id, i.text]));
const ans = (id) => S.answers[id] || (S.answers[id] = { note: '', ms: 0 });
// 一条算答完：四个方面都选了。
function done(id){ const a = S.answers[id]; return !!a && PAIRS.every((p) => a[p.k]); }
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function intro(){
  app.innerHTML = '<div class="card"><h1>评论短句编码</h1><p>请独立完成，不要和别人商量。共 ' + PACK.items.length + ' 条，大约 20 分钟。可以中途关掉页面，下次用同一个浏览器打开会接着做。先把下面的编码手册读一遍；做的时候随时可以再打开看。</p></div>' +
    '<div class="card">' + PACK.codebook + '</div>' +
    '<div class="card"><h2 style="margin-top:0">开始之前</h2>' +
    '<label>你的身份 <select id="q1"><option value="">请选择</option><option>硕士研究生</option><option>博士研究生</option><option>本科生</option><option>其他</option></select></label>' +
    '<label>专业方向 <select id="q2"><option value="">请选择</option><option>设计类</option><option>工科</option><option>文科或社科</option><option>其他</option></select></label>' +
    '<label>你是否看过这批评论以前的编码结果、证据卡，或这篇论文的稿子？ <select id="q3"><option value="">请选择</option><option>没有</option><option>看过</option></select></label>' +
    '<label>你是否打开过这个研究的资料库（GitHub 仓库）？ <select id="q4"><option value="">请选择</option><option>没有</option><option>打开过</option></select></label>' +
    '<label>你以前给这 40 条评论做过编码吗？ <select id="q5"><option value="">请选择</option><option>没有</option><option>做过</option></select></label>' +
    '<p class="mute">不需要填姓名。页面不联网，结果只保存在你这台电脑的浏览器里，最后由你导出发回。</p><p><button class="primary" id="go" disabled>开始</button></p></div>';
  const ids = ['q1', 'q2', 'q3', 'q4', 'q5'], names = ['role', 'field', 'seen', 'repo', 'coded_before'], go = $('go');
  ids.forEach((q, i) => { $(q).value = S.respondent[names[i]] || ''; $(q).onchange = chk; });
  function chk(){ go.disabled = !ids.every((q) => $(q).value); } chk();
  go.onclick = () => { ids.forEach((q, i) => { S.respondent[names[i]] = $(q).value; }); const i = S.order.findIndex((id) => !done(id)); S.at = i < 0 ? 0 : i; save(); work(); };
}

function work(){
  if (S.at >= S.order.length) return finish();
  const id = S.order[S.at], a = ans(id); let shownAt = Date.now();
  const btns = (group, key, list, cur) => '<div class="opts">' + list.map(([v, t]) => '<button class="opt' + (cur === v ? ' on' : '') + '" data-g="' + group + '" data-k="' + key + '" data-v="' + v + '">' + t + '</button>').join('') + '</div>';
  function draw(){
    const note = $('note') ? $('note').value : a.note, bookOpen = $('book') && $('book').style.display === 'block';
    app.innerHTML = '<div class="card"><div class="mute">第 ' + (S.at + 1) + ' 条，共 ' + S.order.length + ' 条 · 已答完 ' + S.order.filter(done).length + ' 条</div><div class="quote" id="quote">' + esc(TEXT[id]) + '</div>' +
      PAIRS.map((p) => '<div class="pair"><h3>' + p.name + '</h3>' + btns('pair', p.k, [['L', '偏左边：' + p.L], ['R', '偏右边：' + p.R], ['U', p.U], ['N', p.N]], a[p.k]) + + '</div>').join('') +
      '<div class="pair"><label>备注（可不填）：判断依据的那几个字，或者“读不懂”<textarea id="note" rows="2"></textarea></label></div>' +
      '<div class="row"><button id="prev">上一条</button><button class="primary" id="next">' + (S.at === S.order.length - 1 ? '完成' : '下一条') + '</button><button id="tog">查看编码手册</button><button id="exp">现在导出</button></div></div><div class="card" id="book">' + PACK.codebook + '</div>';
    $('note').value = note; $('note').oninput = () => { a.note = $('note').value; save(); }; if (bookOpen) $('book').style.display = 'block';
    $('prev').disabled = S.at === 0; $('next').disabled = !done(id);
    app.querySelectorAll('button.opt').forEach((b) => { b.onclick = () => { const g = b.dataset.g, k = b.dataset.k, v = b.dataset.v;
      a[k] = v;
      a.note = $('note').value; save(); const y = scrollY; draw(); scrollTo(0, y); }; });
    const leave = (d) => { a.note = $('note').value.trim(); a.ms += Date.now() - shownAt; S.at += d; save(); scrollTo(0, 0); work(); };
    $('prev').onclick = () => leave(-1); $('next').onclick = () => leave(1);
    $('tog').onclick = () => { const b = $('book'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; if (b.style.display === 'block') b.scrollIntoView({ behavior: 'smooth' }); };
    $('exp').onclick = () => { a.note = $('note').value.trim(); a.ms += Date.now() - shownAt; shownAt = Date.now(); save(); finish(); };
  }
  draw();
}

function finish(){
  const n = S.order.filter(done).length, all = n === S.order.length;
  app.innerHTML = '<div class="card"><h1>' + (all ? '全部答完了，谢谢！' : '已答完 ' + n + ' 条，共 ' + S.order.length + ' 条') + '</h1>' +
    '<label>有没有觉得手册没说清、特别难判的地方？可以不填。<textarea id="notes" rows="3"></textarea></label>' +
    '<p>请把结果发回给邀请你的人，两种方式任选一种：</p><p><button class="primary" id="dl">下载结果文件</button> <span class="mute" id="fname"></span></p>' +
    '<p>下载不了的话，点“复制结果”，把内容粘贴到聊天里发回。</p><textarea id="code" readonly></textarea><p><button id="cp">复制结果</button> <span id="ok" class="mute"></span></p><p><button id="back">' + (all ? '回去检查' : '回去接着答') + '</button></p></div>';
  $('notes').value = S.notes || '';
  const pack = () => { S.notes = $('notes').value.trim(); if (all && !S.finished_at) S.finished_at = new Date().toISOString(); save();
    const out = Object.assign({}, S, { exported_at: new Date().toISOString(), complete: n, total: S.order.length }); delete out.at; return JSON.stringify(out); };
  const name = 'word-pair-coding-' + S.coder_id + '.json'; $('fname').textContent = '文件名：' + name;
  const refresh = () => { $('code').value = 'S6C1:' + btoa(unescape(encodeURIComponent(pack()))); }; refresh(); $('notes').oninput = refresh;
  $('dl').onclick = () => { const x = document.createElement('a'); x.href = URL.createObjectURL(new Blob([pack()], { type: 'application/json' })); x.download = name; document.body.appendChild(x); x.click(); x.remove(); };
  $('cp').onclick = async () => { refresh(); const t = $('code'); t.select(); try { await navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } $('ok').textContent = '已复制'; };
  $('back').onclick = () => { S.notes = $('notes').value.trim(); const i = S.order.findIndex((x) => !done(x)); S.at = i < 0 ? S.order.length - 1 : i; save(); work(); };
}
if (S.at < 0) intro(); else work();
</script>
</body>
</html>
