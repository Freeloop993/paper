<section class="brief" id="brief"><h2>本次设计委托</h2><p>一台日常随行航拍四旋翼。展开时呈现紧凑感，前视相机朝向机头。</p><p id="task"></p><details class="common-detail"><summary>查看共同委托与原始参照</summary><p>提交展开状态的正交顶视产品概念图。四个电机、每轴静止双叶、机臂完整。保持轴位等宽等长及对角中心距 250 mm，镜片可被机鼻遮挡。</p><img src="reference.png" alt="两场共用的原始轴位参照"></details></section>
