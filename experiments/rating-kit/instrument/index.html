<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>顶视图独立评议</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#163632;font:16px/1.6 system-ui,sans-serif}
main{max-width:1150px;margin:24px auto;padding:0 18px}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h1{font-size:1.55rem}#stage{color:#42655d}article{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
figure,form{margin:0;background:white;border:1px solid #cbd9d6;border-radius:12px;padding:18px}figure img{display:block;width:100%;height:auto}figcaption{color:#55716b;text-align:center;font-size:.9rem}fieldset{margin:0 0 20px;padding:0;border:0}legend{font-weight:650;padding:0 0 6px}label{display:inline-flex;align-items:center;gap:4px;min-height:42px;margin:2px 5px 2px 0;padding:2px 8px;background:#f1f5f3;border-radius:5px;cursor:pointer}label:has(input:checked){background:#d1ece3;color:#0b4238}button{font:inherit;border:1px solid #47756c;border-radius:6px;padding:7px 16px;background:#145e51;color:white;cursor:pointer}button:disabled{opacity:.5}.ends{display:flex;justify-content:space-between;gap:1em;color:#405d57}.hint{margin:0 0 16px}.intro{display:block;max-width:680px;margin:10px auto}.intro figure{display:none}.intro h2{margin:0 0 12px;font-size:1.18rem}:focus-visible{outline:3px solid #c47926;outline-offset:2px}#status{color:#844626}@media(max-width:720px){article{grid-template-columns:1fr}main{margin:10px auto}figure,form{padding:12px}}
</style>
<main><header><h1>顶视图独立评议</h1><span id="stage"></span></header>
<article id="layout" class="intro"><figure><img id="image" alt="本页待评顶视图"><figcaption id="code"></figcaption></figure>
<form id="form"><h2 id="subject"></h2><p id="hint" class="hint"></p><div id="fields"></div><button id="next">开始</button>
<p id="status" role="status"></p></form></article></main><script src="pack.js"></script><script src="instrument.js"></script></html>
