<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无人机外观印象评议</title>
<style>
:root{--ink:#1f2328;--mute:#5d6570;--line:#d7dbe0;--bg:#f6f7f8;--card:#fff;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
main{max-width:920px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
h1{font-size:22px;margin:8px 0 0}h2{font-size:18px;margin:0 0 8px}
p{margin:8px 0}.mute{color:var(--mute);font-size:14px}
.bar{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--accent)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
label.q{display:block;margin:14px 0 6px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stim{display:block;width:100%;max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.scale{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.poles{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.poles small{display:block;font-weight:400;color:var(--mute);max-width:18em}.poles div:last-child{text-align:right}.poles div:last-child small{margin-left:auto}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 6px}
.dots button{padding:10px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair figure{margin:0;text-align:center}.pair img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.pair figcaption{font-size:14px;color:var(--mute);margin-top:4px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#code{height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
.warn{color:#a4372b}
</style>
</head>
<body>
<main>
<h1>无人机外观印象评议</h1>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div id="app" class="card"></div>
<p class="mute" id="foot"></p>
</main>
<script>
const PACK = /*__PACK__*/null;
const KEY = 's5pilot/' + PACK.pack;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(list, r){ const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh(){
  const seed = (crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0, r = rng(seed);
  const id = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, '0')).join('');
  const singles = shuffle(PACK.singles, r).map((image) => ({ image, flip: Object.fromEntries(PACK.terms.map((t) => [t.id, r() < 0.5])), ratings: {}, ms: 0 }));
  // 重复题的左右与首次相反；其余左右随机。重复题排在后半段。
  const side = {}; const firstHalf = shuffle(PACK.pairs.filter((p) => !p.repeatOf), r), reps = PACK.pairs.filter((p) => p.repeatOf);
  const order = firstHalf.slice(); reps.forEach((p) => order.splice(Math.floor(order.length / 2) + Math.floor(r() * (order.length / 2 + 1)), 0, p));
  const pairs = order.map((p) => { const sw = p.repeatOf ? !side[p.repeatOf] : r() < 0.5; side[p.id] = sw; return { pair: p.id, left: sw ? p.b : p.a, right: sw ? p.a : p.b, choice: null, reason: '', ms: 0 }; });
  return { schema: PACK.schema, pack: PACK.pack, response_id: id, seed, started_at: new Date().toISOString(), finished_at: null, step: 0, consent: false, background: {}, singles, pairs, closing: {},
    device: { w: innerWidth, h: innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent } };
}
let S; try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
if (!S || S.pack !== PACK.pack) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TOTAL = 3 + S.singles.length + 1 + S.pairs.length + 2;   // 同意、背景、说明一；单图；说明二；成对；结尾、结果
const app = document.getElementById('app'); let shownAt = Date.now();
document.getElementById('foot').textContent = '版本 ' + PACK.version + ' · 编号 ' + S.response_id;
function nav(ok, back = true){ return '<div class="nav">' + (back ? '<button id="back">上一步</button>' : '<span></span>') + '<button id="next" class="primary"' + (ok ? '' : ' disabled') + '>下一步</button></div>'; }
function go(d){ S.step = Math.max(0, Math.min(TOTAL - 1, S.step + d)); save(); render(); scrollTo(0, 0); }
function wire(valid, item){ const n = document.getElementById('next'), b = document.getElementById('back'); const leave = (d) => { if (item) item.ms += Date.now() - shownAt; go(d); }; if (n) { n.disabled = !valid(); n.onclick = () => valid() && leave(1); } if (b) b.onclick = () => leave(-1); }
function refresh(valid){ const n = document.getElementById('next'); if (n) n.disabled = !valid(); }
function radio(name, options, value){ return '<div class="opts" data-name="' + name + '">' + options.map((o) => '<button type="button" data-v="' + esc(o) + '" class="' + (value === o ? 'on' : '') + '">' + esc(o) + '</button>').join('') + '</div>'; }
function bindRadios(obj, after){ app.querySelectorAll('.opts[data-name]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.onclick = () => { obj[g.dataset.name] = b.dataset.v; save(); g.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); after(); })); }

function render(){
  shownAt = Date.now(); document.getElementById('bar').style.width = Math.round(100 * S.step / (TOTAL - 1)) + '%';
  const n1 = S.singles.length, s = S.step;
  if (s === 0) return consent();
  if (s === 1) return background();
  if (s === 2) return intro('第一部分：单张图的印象', '<p>接下来每次看一张四旋翼无人机的顶视图，共 ' + n1 + ' 张。请按第一印象，在三组词之间各选一个位置。</p><p>没有对错。看不出来就选“看不出”。</p>');
  if (s < 3 + n1) return single(S.singles[s - 3], s - 2, n1);
  if (s === 3 + n1) return intro('第二部分：两张图的比较', '<p>接下来每次并排看两张图，共 ' + S.pairs.length + ' 组。请选出看起来<b>更紧凑</b>的一张。</p><p>这里的“紧凑”指：机身、臂与旋翼收拢在一起，部件之间留白少。</p><p>觉得差不多，或者判断不了，也可以直接选。</p>');
  if (s < 4 + n1 + S.pairs.length) return pair(S.pairs[s - 4 - n1], s - 3 - n1, S.pairs.length);
  if (s === TOTAL - 2) return closing();
  return result();
}
function consent(){
  app.innerHTML = '<h2>说明</h2><p>这是一项关于多旋翼无人机外观印象的学位论文研究，大约需要 10 到 15 分钟。</p><p>你会看到一些无人机的顶视图，并回答对它们的印象。没有对错，请按自己的感觉回答，中途不要与别人讨论。</p><p>页面完全离线运行，不会上传任何内容。最后会生成一份结果，请你发回给邀请你的人。结果里不含姓名和联系方式，只有你的回答、作答用时，以及屏幕大小和浏览器类型。</p><p>参加是自愿的，可以随时关闭页面退出。</p><div class="opts" style="margin-top:14px"><button type="button" id="agree" class="' + (S.consent ? 'on' : '') + '">我已阅读以上说明，同意参加</button></div>' + nav(S.consent, false);
  document.getElementById('agree').onclick = (e) => { S.consent = !S.consent; save(); e.target.classList.toggle('on', S.consent); refresh(() => S.consent); };
  wire(() => S.consent);
}
const BG = [['design', '你是否有设计相关的背景？', ['没有', '设计专业学生', '从事设计工作']], ['years', '学习或从事设计的年限', ['不适用', '不到 2 年', '2 到 5 年', '5 年以上']], ['drone', '你对消费级无人机的熟悉程度', ['没接触过', '见过或用过几次', '经常使用或很了解']], ['relation', '你认识这项研究的研究者吗？', ['不认识', '认识']], ['exposure', '在此之前，你是否看过这项研究的图，或听过对这些图的评价？', ['没有', '有']]];
function background(){
  const ok = () => BG.every(([k]) => S.background[k]);
  app.innerHTML = '<h2>先了解一下你</h2>' + BG.map(([k, q, o]) => '<label class="q">' + q + '</label>' + radio(k, o, S.background[k])).join('') + nav(ok());
  bindRadios(S.background, () => refresh(ok)); wire(ok);
}
function intro(title, html){ app.innerHTML = '<h2>' + title + '</h2>' + html + nav(true); wire(() => true); }
function single(item, i, n){
  const ok = () => PACK.terms.every((t) => item.ratings[t.id] !== undefined);
  app.innerHTML = '<p class="mute">第一部分 · 第 ' + i + ' / ' + n + ' 张</p><img class="stim" alt="无人机顶视图" src="' + PACK.images[item.image] + '">' + PACK.terms.map((t) => {
    const L = item.flip[t.id] ? t.right : t.left, R = item.flip[t.id] ? t.left : t.right, v = item.ratings[t.id];
    return '<div class="scale" data-t="' + t.id + '"><div class="poles"><div>' + esc(L.word) + '<small>' + esc(L.hint) + '</small></div><div>' + esc(R.word) + '<small>' + esc(R.hint) + '</small></div></div><div class="dots">' + [1, 2, 3, 4, 5, 6, 7].map((k) => '<button type="button" data-v="' + k + '" class="' + (v === k ? 'on' : '') + '">' + k + '</button>').join('') + '</div><button type="button" data-v="na" class="' + (v === 'na' ? 'on' : '') + '">看不出</button></div>';
  }).join('') + nav(ok());
  app.querySelectorAll('.scale').forEach((g) => g.querySelectorAll('button').forEach((b) => b.onclick = () => { item.ratings[g.dataset.t] = b.dataset.v === 'na' ? 'na' : +b.dataset.v; save(); g.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); refresh(ok); }));
  wire(ok, item);
}
function pair(item, i, n){
  const ok = () => !!item.choice, C = [['left', '左边更紧凑'], ['right', '右边更紧凑'], ['same', '差不多'], ['na', '无法判断']];
  app.innerHTML = '<p class="mute">第二部分 · 第 ' + i + ' / ' + n + ' 组</p><p><b>哪一架看起来更紧凑？</b> <span class="mute">紧凑：机身、臂与旋翼收拢在一起，部件之间留白少。</span></p><div class="pair"><figure><img alt="左图" src="' + PACK.images[item.left] + '"><figcaption>左</figcaption></figure><figure><img alt="右图" src="' + PACK.images[item.right] + '"><figcaption>右</figcaption></figure></div><div class="choice">' + C.map(([v, t]) => '<button type="button" data-v="' + v + '" class="' + (item.choice === v ? 'on' : '') + '">' + t + '</button>').join('') + '</div><label class="q">你主要看的是哪里？（可不填）</label><input type="text" id="why" maxlength="200" value="' + esc(item.reason || '') + '">' + nav(ok());
  app.querySelectorAll('.choice button').forEach((b) => b.onclick = () => { item.choice = b.dataset.v; save(); app.querySelectorAll('.choice button').forEach((x) => x.classList.toggle('on', x === b)); refresh(ok); });
  document.getElementById('why').oninput = (e) => { item.reason = e.target.value; save(); };
  wire(ok, item);
}
function closing(){
  const ok = () => !!S.closing.alone;
  app.innerHTML = '<h2>最后两个问题</h2><label class="q">这份评议是你独自完成的吗？</label>' + radio('alone', ['是', '否'], S.closing.alone) + '<label class="q">还有什么想说的？（可不填）</label><textarea id="cm" rows="3" maxlength="500">' + esc(S.closing.comment || '') + '</textarea>' + nav(ok());
  bindRadios(S.closing, () => refresh(ok));
  document.getElementById('cm').oninput = (e) => { S.closing.comment = e.target.value; save(); };
  wire(ok);
}
function result(){
  if (!S.finished_at) { S.finished_at = new Date().toISOString(); save(); }
  const out = Object.assign({}, S); delete out.step;
  const json = JSON.stringify(out), name = 'drone-review-' + S.response_id + '.json';
  const code = 'S5P1:' + btoa(unescape(encodeURIComponent(json)));
  app.innerHTML = '<h2>完成了，谢谢！</h2><p>请把结果发回给邀请你的人，两种方式任选一种：</p><p><button class="primary" id="dl">下载结果文件</button> <span class="mute">文件名：' + name + '</span></p><p>如果下载不了（比如在手机上），请点“复制结果”，把复制的内容粘贴到聊天里发回。</p><textarea id="code" readonly>' + code + '</textarea><p><button id="cp">复制结果</button> <span id="cpok" class="mute"></span></p><p class="mute">发回之前请不要关闭或刷新这个页面。</p>';
  document.getElementById('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  document.getElementById('cp').onclick = async () => { const t = document.getElementById('code'); t.focus(); t.select(); let ok = false; try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (e2) {} } document.getElementById('cpok').textContent = ok ? '已复制' : '请长按上面的文字手动全选复制'; };
}
render();
</script>
</body>
</html>
