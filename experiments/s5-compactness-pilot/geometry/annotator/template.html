<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无人机取点</title>
<style>
:root{--ink:#17202a;--mute:#5d6b78;--line:#d5dbe1;--accent:#0b6bcb;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:820px;margin:24px auto}
h1{font-size:22px;margin:0 0 10px} h2{font-size:17px;margin:18px 0 6px}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff} button:disabled{opacity:.45;cursor:default}
.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
#stage{width:100%;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:crosshair;display:block}
#lens{width:300px;height:300px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
#ask{font-size:17px;font-weight:600;min-height:54px} .mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap} label{display:block;margin:4px 0}
textarea{width:100%;height:110px;font:12px/1.4 monospace}
ol,ul{padding-left:22px;margin:6px 0}
@media (max-width:900px){.work{grid-template-columns:1fr}.side{position:static}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const PACK = __PACK__;
const KEY = 's5-geometry-' + PACK.pack, app = document.getElementById('app');
const STEPS = ['hubs', 'front', 'rear', 'left', 'right', 'tip'];
function fresh(){ const id = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, '0')).join('');
  return { schema: PACK.schema, pack: PACK.pack, reader_id: id, started_at: new Date().toISOString(), finished_at: null, at: -1, background: {}, images: {},
    device: { w: innerWidth, h: innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent } }; }
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!S || S.pack !== PACK.pack) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const rec = (id) => S.images[id] || (S.images[id] = { hubs: [], front: undefined, rear: undefined, left: undefined, right: undefined, tip: undefined, natural: null, ms: 0 });
// 一张图当前该标哪一项：电机中心没标够就是 hubs，之后依次是机壳前、后、左、右缘和桨尖；undefined 表示还没答，null 表示“看不清”。
function stepOf(item, r){ if (r.hubs.length < item.rotors) return 'hubs'; for (const k of STEPS.slice(1)) if (r[k] === undefined) return k; return 'done'; }
const done = (item) => stepOf(item, rec(item.id)) === 'done';

function intro(){
  app.innerHTML = '<div class="card"><h1>无人机取点</h1><p>这是一项量尺寸的工作，不是评价好坏。请在 ' + PACK.items.length + ' 张无人机的顶视图上点出几个位置。大约 30 到 40 分钟，可以中途关掉页面，下次打开接着做。<b>前 ' + PACK.first + ' 张最重要</b>，时间不够可以只做这些再导出。</p>' +
  '<h2>每张图标什么</h2><ol><li><b>每个电机的中心。</b>有中心螺钉或圆形桨帽的，点它的中心；看不到的，点电机圆盘的中心。两片折叠桨各有一个销轴的，点两个销轴的中点。</li>' +
  '<li><b>机壳的前、后、左、右四个边缘。</b>电机点完以后，图上会出现一条竖线和一条横线。在竖线上点机壳的前缘和后缘，在横线上点机壳的左缘和右缘。机壳指中间那块固定的主体：<b>不算</b>机头外挂的云台相机、天线、机臂、脚架和挂在下面的药箱或载荷。</li>' +
  '<li><b>一片桨叶的桨尖。</b>选一个桨叶完整、看得清的桨，点其中一片桨叶最远的那个尖。</li></ol>' +
  '<h2>怎么操作</h2><ul><li>在大图上点。右边的放大镜跟着鼠标走，十字中心就是要落点的位置。</li><li>点完以后可以用键盘方向键一像素一像素地挪最后一个点。</li><li>点错了按“撤销上一点”（或键盘 Z）。</li><li>确实看不清的（比如桨叶收着、机壳和白底分不开），按“这一项看不清”（或键盘 N），不要猜。</li></ul>' +
  '<h2>开始之前</h2><label>你是否看过这些图的评分结果，或别人在这些图上标的点？ <select id="q1"><option value="">请选择</option><option>没有</option><option>看过</option></select></label>' +
  '<label>你有没有产品设计或工程制图的训练？ <select id="q2"><option value="">请选择</option><option>有</option><option>没有</option></select></label>' +
  '<p class="mute">不需要填姓名。页面不联网，结果只保存在你这台电脑的浏览器里，最后由你导出发回。</p><p><button class="primary" id="go" disabled>开始</button></p></div>';
  const q1 = document.getElementById('q1'), q2 = document.getElementById('q2'), go = document.getElementById('go');
  q1.value = S.background.exposure || ''; q2.value = S.background.training || '';
  const chk = () => { go.disabled = !(q1.value && q2.value); }; q1.onchange = q2.onchange = chk; chk();
  go.onclick = () => { S.background = { exposure: q1.value, training: q2.value }; S.at = Math.max(0, PACK.items.findIndex((it) => !done(it))); save(); work(); };
}

function work(){
  if (S.at >= PACK.items.length) return finish();
  const item = PACK.items[S.at], r = rec(item.id); let shownAt = Date.now(), mouse = null;
  app.innerHTML = '<div class="work"><canvas id="stage" width="1024" height="1024"></canvas><div class="side"><div class="mute" id="prog"></div><div id="ask"></div><canvas id="lens" width="300" height="300"></canvas>' +
    '<div class="row"><button id="undo">撤销上一点 (Z)</button><button id="na">这一项看不清 (N)</button></div><div class="row"><button id="prev">上一张</button><button class="primary" id="next">下一张</button></div>' +
    '<div class="row"><button id="exp">现在导出</button></div><div class="mute">方向键：把最后一个点挪一个像素。</div></div></div>';
  const cv = document.getElementById('stage'), cx = cv.getContext('2d'), lens = document.getElementById('lens'), lx = lens.getContext('2d'), img = new Image();
  const TEXT = { hubs: () => '点电机中心：第 ' + (r.hubs.length + 1) + ' 个，共 ' + item.rotors + ' 个', front: () => '在竖线上点机壳的前缘（靠画面上方的一端）', rear: () => '在竖线上点机壳的后缘', left: () => '在横线上点机壳的左缘', right: () => '在横线上点机壳的右缘', tip: () => '点一片完整桨叶的桨尖', done: () => '这一张标完了，可以检查后点“下一张”' };
  const centre = () => { const n = r.hubs.length; return n ? [r.hubs.reduce((s, p) => s + p[0], 0) / n, r.hubs.reduce((s, p) => s + p[1], 0) / n] : null; };
  const last = () => { const st = stepOf(item, r); if (st === 'hubs') return r.hubs.length ? ['hubs', r.hubs.length - 1] : null; const i = (st === 'done' ? STEPS.length : STEPS.indexOf(st)) - 1; return i >= 1 ? [STEPS[i]] : (r.hubs.length ? ['hubs', r.hubs.length - 1] : null); };
  function draw(){
    const W = img.naturalWidth || 1024, k = 1024 / W, st = stepOf(item, r); cx.clearRect(0, 0, 1024, 1024); if (img.complete && img.naturalWidth) cx.drawImage(img, 0, 0, 1024, 1024);
    const c = centre();
    if (c && st !== 'hubs') { cx.strokeStyle = 'rgba(255,140,0,.75)'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(c[0] * k, 0); cx.lineTo(c[0] * k, 1024); cx.moveTo(0, c[1] * k); cx.lineTo(1024, c[1] * k); cx.stroke(); }
    const dot = (p, col, lab) => { if (!p) return; cx.strokeStyle = col; cx.lineWidth = 2; cx.beginPath(); cx.arc(p[0] * k, p[1] * k, 7, 0, 7); cx.stroke(); cx.beginPath(); cx.moveTo(p[0] * k - 12, p[1] * k); cx.lineTo(p[0] * k - 3, p[1] * k); cx.moveTo(p[0] * k + 3, p[1] * k); cx.lineTo(p[0] * k + 12, p[1] * k); cx.moveTo(p[0] * k, p[1] * k - 12); cx.lineTo(p[0] * k, p[1] * k - 3); cx.moveTo(p[0] * k, p[1] * k + 3); cx.lineTo(p[0] * k, p[1] * k + 12); cx.stroke(); if (lab) { cx.fillStyle = col; cx.font = '16px sans-serif'; cx.fillText(lab, p[0] * k + 10, p[1] * k - 10); } };
    r.hubs.forEach((p, i) => dot(p, '#00a040', String(i + 1))); ['front', 'rear', 'left', 'right'].forEach((s) => dot(r[s], '#0b6bcb', { front: '前', rear: '后', left: '左', right: '右' }[s])); dot(r.tip, '#c2188f', '桨尖');
    document.getElementById('ask').textContent = TEXT[st](); document.getElementById('prog').textContent = '第 ' + (S.at + 1) + ' 张，共 ' + PACK.items.length + ' 张 · 已标完 ' + PACK.items.filter(done).length + ' 张' + (S.at < PACK.first ? ' · 重点部分' : '');
    document.getElementById('undo').disabled = !last(); document.getElementById('na').disabled = st === 'hubs' || st === 'done'; document.getElementById('prev').disabled = S.at === 0; document.getElementById('next').disabled = st !== 'done';
    drawLens();
  }
  function drawLens(){ lx.fillStyle = '#fff'; lx.fillRect(0, 0, 300, 300); if (!mouse || !img.naturalWidth) return; const Z = 5, half = 150 / Z; lx.imageSmoothingEnabled = false;
    lx.drawImage(img, mouse[0] - half, mouse[1] - half, half * 2, half * 2, 0, 0, 300, 300); lx.strokeStyle = '#e00000'; lx.lineWidth = 1; lx.beginPath(); lx.moveTo(150, 0); lx.lineTo(150, 140); lx.moveTo(150, 160); lx.lineTo(150, 300); lx.moveTo(0, 150); lx.lineTo(140, 150); lx.moveTo(160, 150); lx.lineTo(300, 150); lx.stroke(); }
  const toImage = (e) => { const b = cv.getBoundingClientRect(), W = img.naturalWidth || 1024; return [Math.round((e.clientX - b.left) / b.width * W), Math.round((e.clientY - b.top) / b.height * W)]; };
  cv.onmousemove = (e) => { mouse = toImage(e); drawLens(); };
  cv.onclick = (e) => { const st = stepOf(item, r), p = toImage(e); if (st === 'done') return; if (st === 'hubs') r.hubs.push(p); else r[st] = p; r.natural = [img.naturalWidth, img.naturalHeight]; save(); draw(); };
  const undo = () => { const l = last(); if (!l) return; if (l[0] === 'hubs') r.hubs.pop(); else r[l[0]] = undefined; save(); draw(); };
  const na = () => { const st = stepOf(item, r); if (st === 'hubs' || st === 'done') return; if (st === 'tip') r.tip = null; else ['front', 'rear', 'left', 'right'].forEach((s) => { if (r[s] === undefined) r[s] = null; }); save(); draw(); };
  const leave = (d) => { r.ms += Date.now() - shownAt; S.at += d; save(); document.onkeydown = null; work(); };
  document.getElementById('undo').onclick = undo; document.getElementById('na').onclick = na; document.getElementById('prev').onclick = () => leave(-1); document.getElementById('next').onclick = () => leave(1);
  document.getElementById('exp').onclick = () => { r.ms += Date.now() - shownAt; shownAt = Date.now(); save(); document.onkeydown = null; finish(true); };
  document.onkeydown = (e) => { const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (d) { const l = last(); if (!l) return; const p = l[0] === 'hubs' ? r.hubs[l[1]] : r[l[0]]; if (!p) return; p[0] += d[0]; p[1] += d[1]; mouse = p.slice(); save(); draw(); e.preventDefault(); }
    else if (e.key === 'z' || e.key === 'Z') undo(); else if (e.key === 'n' || e.key === 'N') na(); };
  img.onload = draw; img.src = PACK.images[item.id]; draw();
}

function finish(partial){
  const n = PACK.items.filter(done).length; if (n === PACK.items.length && !S.finished_at) { S.finished_at = new Date().toISOString(); save(); }
  const out = Object.assign({}, S, { exported_at: new Date().toISOString(), complete: n }); delete out.at;
  const json = JSON.stringify(out), name = 'drone-points-' + S.reader_id + '.json', code = 'S5G1:' + btoa(unescape(encodeURIComponent(json)));
  app.innerHTML = '<div class="card"><h1>' + (n === PACK.items.length ? '全部标完了，谢谢！' : '已标完 ' + n + ' 张，共 ' + PACK.items.length + ' 张') + '</h1><p>请把结果发回给邀请你的人，两种方式任选一种：</p><p><button class="primary" id="dl">下载结果文件</button> <span class="mute">文件名：' + name + '</span></p>' +
    '<p>下载不了的话，点“复制结果”，把内容粘贴到聊天里发回。</p><textarea id="code" readonly></textarea><p><button id="cp">复制结果</button> <span id="ok" class="mute"></span></p>' + (n < PACK.items.length ? '<p><button id="back">回去接着标</button></p>' : '') + '</div>';
  document.getElementById('code').value = code;
  document.getElementById('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  document.getElementById('cp').onclick = async () => { const t = document.getElementById('code'); t.select(); try { await navigator.clipboard.writeText(code); } catch (e) { document.execCommand('copy'); } document.getElementById('ok').textContent = '已复制'; };
  const b = document.getElementById('back'); if (b) b.onclick = () => { S.at = Math.max(0, PACK.items.findIndex((it) => !done(it))); save(); work(); };
}
if (S.at < 0) intro(); else work();
</script>
</body>
</html>
